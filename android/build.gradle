buildscript {
    repositories {
        google() // Required for Firebase
        mavenCentral() // Additional repository for dependencies
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.1.1' // Match your Android Gradle plugin version
        classpath 'com.google.gms:google-services:4.4.2' // Correct the version if needed
    }
}

allprojects {
    repositories {
        google() // Required for Firebase
        mavenCentral() // Additional repository for dependencies
    }
}





rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
