  web:
    generate: true
    image_path: "assets/whitelogo.png"
    background_color: "#416d6d"  # Teal color
    theme_color: "#008080"

  windows:
    generate: true
    image_path: "assets/whitelogo.png"
    icon_size: 48

  macos:
    generate: true
    image_path: "assets/whitelogo.png"