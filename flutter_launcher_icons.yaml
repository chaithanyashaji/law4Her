dev_dependencies:
  flutter_launcher_icons: "^0.14.2"

flutter_icons:
  android: true
  ios: true
  adaptive_icon_background: "#416d6d"  # Teal color
  adaptive_icon_foreground: "assets/whitelogo.png"
